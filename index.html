<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
 <link rel="icon" type="image/png" href="favicon.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0505;
    --bg2: #120808;
    --panel: #170a0a;
    --panel2: #1d0c0c;
    --border: rgba(226, 19, 19, 0.18);
    --border-strong: rgba(226, 19, 19, 0.42);
    --red: #e21313;
    --red-dim: #8a0f0f;
    --amber: #ff7a45;
    --text: #f5e9e9;
    --muted: #8a6a6a;
    --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;


    --bg-image: none;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    line-height: 1.6;
    overflow: hidden;
  }

  ::selection { background: var(--red); color: #0a0505; }


  .wallpaper {
    position: fixed; inset: 0; z-index: 0;
    background-image: linear-gradient(rgba(10,5,5,.78), rgba(10,5,5,.78)), var(--bg-image);
    background-size: cover;
    background-position: center;
  }


  body::after {
    content: ''; position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(226,19,19,0.14), transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(0,0,0,0.65), transparent 60%);
  }


  body::before {
    content: ''; position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(226,19,19,0.03) 0px, rgba(226,19,19,0.03) 1px,
      transparent 1px, transparent 3px
    );
    mix-blend-mode: overlay;
  }

  .page { position: relative; z-index: 3; height: 100%; }


  .settings {
    position: absolute; top: 28px; right: 28px;
    width: 36px; height: 36px;
    display: grid; place-items: center;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .settings:hover { color: var(--red); border-color: var(--red); background: rgba(226,19,19,0.08); }
  .settings svg { width: 17px; height: 17px; }


  .center {
    position: absolute; top: 249px; left: 50%;
    transform: translateX(-50%);
    width: min(520px, 88vw);
  }

  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--red);
    margin-bottom: 14px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 0 3px rgba(226,19,19,0.18);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(226,19,19,0.18); }
    50%      { box-shadow: 0 0 0 6px rgba(226,19,19,0.05); }
  }


  .search {
    display: flex; align-items: center; gap: 12px;
    height: 50px; padding: 0 16px;
    background: var(--panel);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    box-shadow: 0 0 60px -20px rgba(226,19,19,0.35);
    transition: border-color .15s, box-shadow .15s;
  }
  .search:focus-within {
    border-color: var(--red);
    box-shadow: 0 0 40px -10px rgba(226,19,19,0.55);
  }
  .prompt { color: var(--red); font-weight: 700; font-size: 14px; user-select: none; }
  .search input {
    flex: 1; min-width: 0;
    background: transparent; border: 0; outline: 0;
    color: var(--text);
    font-family: var(--mono); font-size: 13.5px;
    caret-color: var(--red);
  }
  .search input::placeholder { color: var(--muted); }

  .hint {
    margin-top: 10px;
    font-size: 11px; color: var(--muted); letter-spacing: 0.05em;
  }
  .hint b { color: var(--red); font-weight: 600; }


  .clock {
    position: absolute; left: 28px; bottom: 24px;
    font-size: 11.5px; color: var(--muted); letter-spacing: 0.08em;
  }
  .clock b { color: var(--red); font-weight: 600; }

  @media (max-width: 700px) {
    .center { top: 32vh; }
  }
</style>
</head>
<body>
  <div class="wallpaper"></div>

  <div class="page">
    <button class="settings" id="settingsBtn" title="Set background image" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>
    </button>

    <div class="center">
      <div class="eyebrow"><span class="dot"></span>Ready</div>
      <form class="search" id="searchForm" autocomplete="off">
        <span class="prompt">&gt;_</span>
        <input id="q" type="text" placeholder="Ask anything, find anything..." autofocus>
      </form>
      <div class="hint">Searching with <b>Brave Search</b> · press <b>Enter</b> to search or open a URL</div>
    </div>

    <div class="clock" id="clock"></div>
  </div>

<script>

  const SEARCH_URL = "https://search.brave.com/search?q=";

  document.getElementById("searchForm").addEventListener("submit", e => {
    e.preventDefault();
    const v = document.getElementById("q").value.trim();
    if (!v) return;
    const looksLikeUrl = /^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(\/\S*)?$/i.test(v);
    window.location.href = looksLikeUrl
      ? (/^https?:\/\//i.test(v) ? v : "https://" + v)
      : SEARCH_URL + encodeURIComponent(v);
  });

  // Clock
  function tick() {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    document.getElementById("clock").innerHTML =
      "<b>$</b> " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + " · " +
      d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }
  tick(); setInterval(tick, 15000);


  function applyBg(url) {
    document.documentElement.style.setProperty("--bg-image", url ? 'url("' + url + '")' : "none");
  }
  try { applyBg(localStorage.getItem("ntp_bg") || ""); } catch (e) {}

  document.getElementById("settingsBtn").addEventListener("click", () => {
    const url = prompt("Background image URL (empty or 'reset' to clear):");
    if (url === null) return;
    const clean = (url.trim().toLowerCase() === "reset") ? "" : url.trim();
    applyBg(clean);
    try { localStorage.setItem("ntp_bg", clean); } catch (e) {}
  });
</script>
</body>
</html>
